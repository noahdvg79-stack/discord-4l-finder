name: Discord 4L Username Finder

on:
  workflow_dispatch:

  # Restart periodically so the scanner
  # can continue after GitHub's runner limit.
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: discord-4l-scanner
  cancel-in-progress: false

jobs:

  scanner:

    runs-on: ubuntu-latest

    # GitHub-hosted jobs cannot run forever.
    # Run for almost 6 hours, then the next
    # scheduled run starts another session.
    timeout-minutes: 350

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python scanner.py
