name: Discord 4L Finder - Apify

on:

  workflow_dispatch:

permissions:
  contents: read

jobs:

  scanner:

    runs-on: ubuntu-latest

    # Maximum practical GitHub-hosted run.
    timeout-minutes: 350

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================
      # SCANNER
      # ==========================================

      - name: Run scanner
        env:

          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

          PYTHONUNBUFFERED: "1"

        run: |

          python -u scanner.py
